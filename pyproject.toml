[project]
name = "slopworld-tools"
version = "0.0.0"
description = "Development tools for the SlopWorld repository"
requires-python = ">=3.12"
dependencies = ["PyYAML"]

[project.optional-dependencies]
assets = ["numpy", "Pillow", "pycairo", "PyGObject", "CairoSVG"]

[dependency-groups]
dev = ["ruff", "pytest", "pytest-cov"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["priv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
isort = { force-single-line = true, known-first-party = ["tools"] }

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tools"]
addopts = ["-ra", "--import-mode=importlib"]

[tool.coverage.run]
branch = true
omit = ["*/test_*.py", "*/__init__.py"]
data_file = "coverage/.coverage.python"

[tool.coverage.report]
precision = 2
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# Tools import directly from the checkout; uv installs only their dependencies.
[tool.uv]
package = false
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]
