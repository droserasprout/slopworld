# $XAUTHORITY as well as the classic path: Xwayland writes the cookie under
# $XDG_RUNTIME_DIR under a name of its own and leaves ~/.Xauthority absent. Made once per
# login, so bound by name rather than by directory.
[[sandbox]]
name = "x11"
category = "desktop"
description = "X11 display, for anything that opens or reads a window"
escapes = "every X client shares one input stream: this can read other windows and type into them"
ro = ["/tmp/.X11-unix", "~/.Xauthority", "$XAUTHORITY"]
env = ["DISPLAY", "XAUTHORITY"]
