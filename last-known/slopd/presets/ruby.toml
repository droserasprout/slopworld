# RubyGems loads rubygems_plugin.rb from every installed gem on every gem command, including the
# host's, so the gem tree stays read-only.
[[sandbox]]
name = "ruby"
category = "dev"
description = "user-installed gems and Bundler configuration, read-only"
ro = [
    "~/.gemrc",
    "~/.gem",
    "~/.local/share/gem",
    # The file rather than ~/.bundle, which also holds Bundler plugins.
    "~/.bundle/config",
]
