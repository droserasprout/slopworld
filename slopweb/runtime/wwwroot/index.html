<!doctype html>
<html lang="en"><meta charset="utf-8"><title>SlopWorld</title>
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<link rel="icon" type="image/png" href="favicon.png">
<style>
.workspace-app { margin:0; background:#171510; color:#e6dfce; font:16px monospace; }
.workspace-app h1,.workspace-app #result { margin:24px; white-space:pre-wrap; }
.workspace-app canvas { width:min(100vw,calc(100vh * var(--workspace-aspect,1.777778)))!important; max-width:none!important; height:auto; margin:auto; }
.workspace-app.ready { height:var(--workspace-height,100vh); display:grid; place-items:center; overflow:hidden; }
.workspace-app.ready h1,.workspace-app.ready #result { display:none; }
.workspace-app.loading { height:100vh; display:grid; place-items:center; overflow:hidden; background:#000; }
.workspace-app.loading h1,.workspace-app.loading #result { display:none; }
.workspace-app #loading-screen { position:fixed; inset:0; z-index:1; pointer-events:none; }
#ios-stub { position:fixed; inset:0; display:grid; place-content:center; justify-items:center; gap:16px; }
#ios-stub[hidden] { display:none; }
#ios-stub h1 { display:block; margin:0; font:inherit; }
</style>
<body class="workspace-app loading"><h1>SlopWorld</h1><pre id="result">Loading…</pre>

<main id="ios-stub" hidden>
  <img src="favicon.png" width="64" height="64" alt="SlopWorld">
  <h1>iOS is not supported</h1>
</main>
<script>
  // iPadOS can present a Mac user agent when requesting desktop sites.
  if (/iPhone|iPad|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
    document.getElementById('ios-stub').hidden = false;
  } else {
    import('./bootstrap.js');
  }
</script></body></html>
