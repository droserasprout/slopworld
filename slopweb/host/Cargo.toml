[package]
name = "slopweb"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native host for the SlopWorld browser workspace"

[dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "string"] }
clap_complete = "4"
fs2 = "0.4"
futures = "0.3"
libc = "0.2"
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "signal", "fs", "io-util", "net"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
toml = "0.8"
ttf-parser = "0.25"
url = "2"
xmltree = "0.11"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
strip = true
