<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Local managed WASM probe</title>
<style>
.workspace-app { margin:0; background:#171510; color:#e6dfce; font:16px monospace; }
.workspace-app h1,.workspace-app #result { margin:24px; white-space:pre-wrap; }
.workspace-app canvas { width:min(100vw,calc(100vh * var(--workspace-aspect,1.777778)))!important; max-width:none!important; height:auto; margin:auto; }
.workspace-app.ready { height:100vh; display:grid; place-items:center; overflow:hidden; }
.workspace-app.ready h1,.workspace-app.ready #result { display:none; }
.workspace-app.loading { height:100vh; display:grid; place-items:center; overflow:hidden; background:#000; }
.workspace-app.loading h1,.workspace-app.loading #result { display:none; }
.workspace-app #loading-screen { position:fixed; inset:0; z-index:1; pointer-events:none; }
</style>
<body><h1>Local managed WASM probe</h1><pre id="result">Loading…</pre>
<script>
const startupParameters=new URLSearchParams(location.search);
if(location.pathname==='/' || (startupParameters.has('workspace') && startupParameters.has('app')))
  document.body.className='workspace-app loading';
</script>
<script type="module" src="bootstrap.js"></script></body></html>
