<!doctype html>
<meta charset="utf-8">
<title>SlopWorld browser transport check</title>
<pre id="result">Checking host transport…</pre>
<script type="module">
window.__probeResult = { status: 'running' };
let socket;
try {
  const health = await fetch('/host/api/health');
  const bytes = new Uint8Array(await health.arrayBuffer());
  if (!health.ok || bytes[0] !== 8 || bytes[1] !== 1) throw new Error('Daemon health failed');
  socket = new WebSocket(`ws://${location.host}/host/ws`, 'slopworld.protobuf.v2');
  socket.binaryType = 'arraybuffer';
  const snapshot = await new Promise((resolve, reject) => {
    const timer = setTimeout(() => reject(new Error('Snapshot timed out')), 10000);
    socket.onmessage = event => { clearTimeout(timer); resolve(event.data); };
    socket.onerror = () => { clearTimeout(timer); reject(new Error('WebSocket failed')); };
  });
  if (!(snapshot instanceof ArrayBuffer) || !snapshot.byteLength) throw new Error('Missing binary snapshot');
  window.__probeResult = { status: 'pass', health: health.status,
    protocol: socket.protocol, snapshotBytes: snapshot.byteLength };
} catch (error) {
  window.__probeResult = { status: 'fail', error: String(error) };
} finally {
  socket?.close();
  document.querySelector('#result').textContent = JSON.stringify(window.__probeResult, null, 2);
}
</script>
