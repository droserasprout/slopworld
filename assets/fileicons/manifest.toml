# What the files view draws beside a name, and what earns each icon.
#
# Use one table for each icon.
# The key is the upstream SVG name in the Material Icon Theme.
# The key is also the generated PNG name and the value that FileIcons.cs uses.
# See the LICENSE file in this directory.
#
#   ext   = extensions, without the dot, matched case-insensitively and
#           longest-first, so `tar.gz` beats `gz`.
#   names = whole filenames, matched before any extension is considered.
#
# `folder-base` identifies directories.
# `document` identifies files that match no other entry.

[folder-base]

[document]
ext = ["txt", "text", "rtf", "doc", "docx", "odt"]

# ---------------------------------------------------------------- languages

[rust]
ext = ["rs"]

[python]
ext = ["py", "pyi", "pyw"]

[typescript]
ext = ["ts", "mts", "cts"]

[react]
ext = ["tsx", "jsx"]

[javascript]
ext = ["js", "mjs", "cjs"]

[go]
ext = ["go"]
names = ["go.mod", "go.sum"]

[csharp]
ext = ["cs", "csx"]

[c]
ext = ["c"]

[h]
ext = ["h", "hh", "hpp", "hxx"]

[cpp]
ext = ["cpp", "cc", "cxx", "c++"]

[java]
