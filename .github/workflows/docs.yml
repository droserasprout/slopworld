name: Documentation

on:
  push:
    # Include development branches that publish documentation previews.
    branches: [main, human-docs, road-to-release]
    paths:
      - 'README.md'
      - '**/README.md'
      - 'notes/**'
      - 'docs/**'
      - 'tools/__init__.py'
      - 'tools/utils.py'
      - 'tools/docs/**'
      - 'tools/version/**'
      - 'slopd/Cargo.toml'
      - 'justfile'
      - 'just/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/actions/setup-build-tools/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build-tools

      # Keep this version aligned with docs/theme/index.hbs.
      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4

      - name: Test checks and build book
        run: just test-docs docs

      - name: Upload book
        uses: actions/upload-artifact@v4
        with:
          name: book
          path: docs/book/
          if-no-files-found: error

      - name: Publish to Cloudflare Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/human-docs' || github.ref == 'refs/heads/road-to-release'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/book --project-name=slopworld --branch=${{ github.ref_name }}
