name: Documentation

on:
  push:
    branches: ['**']
    paths:
      - '**/*.md'
      - 'notes/**'
      - 'docs/**'
      - 'tools/__init__.py'
      - 'tools/utils.py'
      - 'tools/docs/**'
      - 'tools/version/**'
      - 'slopd/Cargo.toml'
      - 'justfile'
      - 'just/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/actions/setup-build-tools/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-build-tools

      # Keep this version aligned with docs/theme/index.hbs.
      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4

      - name: Test checks and build book
        run: |
          just tools-test tools/docs
          just docs-build

      - name: Upload book
        uses: actions/upload-artifact@v6
        with:
          name: book
          path: docs/book/
          if-no-files-found: error

      - name: Publish to Cloudflare Pages
        # Production publication is manual; preview branches still publish on push.
        if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || github.ref == 'refs/heads/human-docs' || github.ref == 'refs/heads/road-to-release'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/book --project-name=slopworld --branch=${{ github.ref_name }}
