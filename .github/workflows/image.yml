name: Sidecar image

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag whose image version should be published
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.image.outputs.image }}
      version: ${{ steps.image.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set image tags
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          image="ghcr.io/${OWNER,,}/slopcar"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || exit 1
            version="$(python3 -m tools.version.metadata "$RELEASE_TAG")"
            # The reusable builder builds GITHUB_SHA, not this job's checkout.
            release_sha="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
            if [[ "$release_sha" != "$GITHUB_SHA" ]]; then
              echo "Release tag $RELEASE_TAG must match the workflow commit $GITHUB_SHA." >&2
              exit 1
            fi
          else
            [[ "$GITHUB_REF" == refs/tags/* ]] || exit 1
            version="$(python3 -m tools.version.metadata "$GITHUB_REF_NAME")"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    uses: docker/github-builder/.github/workflows/build.yml@4345a1cea1e4cfb65c8a5e2b1b80f9e630068827 # v1
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      context: .
      file: slopcar/Dockerfile
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      distribute: true
      cache: true
      # Keep signed caches separate from entries written by the previous builder.
      cache-scope: slopcar-signed-v1
      cache-mode: max
      sign: 'true'
      build-args: |
        SLOPWORLD_BUILD_VERSION=${{ needs.prepare.outputs.version }}
      meta-images: ${{ needs.prepare.outputs.image }}
      meta-tags: |
        type=raw,value=sha-${{ github.sha }}
        type=raw,value=${{ needs.prepare.outputs.version }}
      meta-flavor: latest=false
      labels: |
        org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
        org.opencontainers.image.revision=${{ github.sha }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  attest:
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest the published multi-platform image digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ needs.prepare.outputs.image }}
          subject-digest: ${{ needs.publish.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
