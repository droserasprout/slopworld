name: Sidecar image

on:
  push:
    branches: [main]
    tags: ['v*', '[0-9]*']
    # Keep aligned with the Dockerfile COPY inputs and root build context.
    paths:
      - 'tools/version/**'
      - 'tools/utils.py'
      - 'tools/__init__.py'
      - 'slopd/Cargo.toml'
      - 'slopd/Cargo.lock'
      - 'slopd/build.rs'
      - 'slopd/src/**'
      - 'slopd/presets/**'
      - 'shared/slopworld.proto'
      - 'slopcar/Dockerfile'
      - 'slopcar/entrypoint.sh'
      - 'slopcar/doctor.sh'
      - '.dockerignore'
      - 'LICENSE'
      - 'licenses/**'
      - '.github/workflows/image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set image tags
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/${OWNER,,}/slopcar"
          version="$(python3 -m tools.version.mod_version)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<EOF'
            echo "$image:sha-$GITHUB_SHA"
            echo "$image:$version"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish sidecar
        uses: docker/build-push-action@v7
        with:
          context: .
          file: slopcar/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SLOPWORLD_BUILD_VERSION=${{ steps.image.outputs.version }}
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=slopcar
          cache-to: type=gha,scope=slopcar,mode=max
