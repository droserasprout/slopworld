name: Sidecar image

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag whose image version should be published
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.image.outputs.image }}
      version: ${{ steps.image.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set image tags
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          image="ghcr.io/${OWNER,,}/slopcar"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || exit 1
            version="$(python3 -m tools.version.metadata "$RELEASE_TAG")"
            # The reusable builder builds GITHUB_SHA, not this job's checkout.
            release_sha="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
            if [[ "$release_sha" != "$GITHUB_SHA" ]]; then
              echo "Release tag $RELEASE_TAG must match the workflow commit $GITHUB_SHA." >&2
              exit 1
            fi
          else
            [[ "$GITHUB_REF" == refs/tags/* ]] || exit 1
            version="$(python3 -m tools.version.metadata "$GITHUB_REF_NAME")"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      packages: write
    with:
      context: .
      file: slopcar/Dockerfile
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      distribute: true
      cache: true
      cache-scope: slopcar
      cache-mode: max
      sign: 'false'
      build-args: |
        SLOPWORLD_BUILD_VERSION=${{ needs.prepare.outputs.version }}
      meta-images: ${{ needs.prepare.outputs.image }}
      meta-tags: |
        type=raw,value=sha-${{ github.sha }}
        type=raw,value=${{ needs.prepare.outputs.version }}
      meta-flavor: latest=false
      labels: |
        org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
        org.opencontainers.image.revision=${{ github.sha }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
