name: Test

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to test
        required: false
        default: ''
        type: string
    outputs:
      commit:
        description: Tested commit
        value: ${{ jobs.test.outputs.commit }}

permissions:
  contents: read

concurrency:
  # Called tests and manual runs get their own group; only branch pushes
  # supersede older runs.
  group: test-${{ github.event_name == 'push' && inputs.ref == '' && github.ref_type == 'branch' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && inputs.ref == '' && github.ref_type == 'branch' }}

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: debian:forky-slim@sha256:7bb96d9b4ccd7f46f54853c258a56df0c6b628a63e65c2317959da18fd36932c
      # Sandbox tests need nested user namespaces and mounts.
      options: --privileged
    defaults:
      run:
        shell: bash
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git unzip build-essential pkg-config \
            libasound2-dev libicu78 libssl3t64 zlib1g \
            python3 procps tmux=3.7c-1 less ripgrep bubblewrap

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Record tested revision
        id: revision
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-build-tools
        with:
          coverage: 'true'

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          # The game-free harness targets net8.0 and needs its matching runtime.
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: |
            mod/Dependencies/packages.lock.json
            mod/Tests/packages.lock.json
            .config/dotnet-tools.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview, rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: slopd

      - name: Check bubblewrap namespaces in the CI container
        run: |
          bwrap --unshare-all --ro-bind / / --proc /proc --dev /dev -- /usr/bin/true

      - name: Expose Rust LLVM tools
        run: |
          echo "$(dirname "$(rustc --print target-libdir)")/bin" >> "$GITHUB_PATH"

      # Keep the same checks/order as just ci, with separate step timings.
      - name: Check generated files and formatting
        run: just check-generated check-format-daemon check-format-mod

      - name: Lint Python
        run: just lint-tools

      - name: Test tools and pager
        run: just test-tools test-pager

      - name: Lint Rust
        run: just lint-daemon

      - name: Test Rust with coverage
        run: just coverage-daemon

      - name: Test C# with coverage
        run: just coverage-mod

      - name: Report coverage
        run: |
          just coverage-summary >> "$GITHUB_STEP_SUMMARY"
          echo 'C# coverage measures linked production files in the game-free harness, not the entire mod. No percentage threshold is enforced.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: ${{ !cancelled() && hashFiles('coverage/*.cobertura.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/*.cobertura.xml
            coverage/rust.files.txt
          if-no-files-found: error
