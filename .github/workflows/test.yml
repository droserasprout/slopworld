name: Test

on:
  push:
    branches:
      - '**'
      # Release calls this workflow for tags and packaging previews.
      - '!release-ci'
    # Documentation has its own workflow; mixed code/docs pushes still run tests.
    paths-ignore:
      - 'docs/**'
      - 'notes/**'
      - '**/*.md'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to test
        required: false
        default: ''
        type: string
    outputs:
      commit:
        description: Tested commit
        value: ${{ jobs.revision.outputs.commit }}

permissions:
  contents: read

concurrency:
  # Called tests and manual runs get their own group; only branch pushes
  # supersede older runs.
  group: test-${{ github.event_name == 'push' && inputs.ref == '' && github.ref_type == 'branch' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && inputs.ref == '' && github.ref_type == 'branch' }}

jobs:
  revision:
    name: Resolve tested commit
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Record tested revision
        id: revision
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  rust:
    name: Rust
    needs: revision
    runs-on: ubuntu-24.04
    container:
      image: debian:forky-slim
      # Sandbox tests need nested user namespaces and mounts.
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - name: Install system dependencies
        # actions/cache uses zstd when available; gzip makes Rust cache saves slow.
        run: |
          # GitHub mounts HOME at /github/home in job containers.
          # Edit passwd directly: usermod rejects root while it owns PID 1.
          sed -i "/^root:/s|:/root:|:$HOME:|" /etc/passwd
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git unzip zstd build-essential pkg-config \
            libasound2-dev \
            python3 procps tmux=3.7c-1 less ripgrep bubblewrap

      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.revision.outputs.commit }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-build-tools
        with:
          coverage: 'true'
          protoc: 'true'

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: ""
          # rust-cache keys compiler identity and job-level Rust/Cargo flags.
          # Keep coverage-tool/policy changes in the restore prefix too.
          cache-key: coverage-v1-${{ hashFiles('.github/actions/setup-build-tools/*', 'just/daemon.just', 'rust-toolchain.toml') }}
          # slopd/target includes the isolated llvm-cov-target dependency build.
          cache-workspaces: |
            slopd -> target
            slopcar -> target

      - name: Check bubblewrap namespaces in the CI container
        run: |
          bwrap --unshare-all --ro-bind / / --proc /proc --dev /dev -- /usr/bin/true

      - name: Check Rust and collect coverage
        run: just ci-rust

      - name: Report coverage
        run: just coverage-summary-rust >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: ${{ !cancelled() && hashFiles('coverage/rust*.cobertura.xml') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-rust
          path: |
            coverage/rust*.cobertura.xml
            coverage/rust.files.txt
          if-no-files-found: error

  tools:
    name: Python and tooling
    needs: revision
    runs-on: ubuntu-24.04
    container:
      image: debian:forky-slim
    defaults:
      run:
        shell: bash
    steps:
      - name: Install system dependencies
        run: |
          # Match the account database to GitHub's mounted home for rustup.
          # Edit passwd directly: usermod rejects root while it owns PID 1.
          sed -i "/^root:/s|:/root:|:$HOME:|" /etc/passwd
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git unzip zstd gcc libc6-dev python3 procps tmux=3.7c-1 less ripgrep

      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.revision.outputs.commit }}

      - uses: ./.github/actions/setup-build-tools
        with:
          protoc: 'true'

      # Protocol generators and their Python tests format Rust output.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt
          cache: false
          build-warnings: ""

      - name: Check Python and tooling
        run: just ci-tools

  mod:
    name: C#
    needs: revision
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.revision.outputs.commit }}

      - uses: ./.github/actions/setup-build-tools

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          # The game-free harness targets net8.0 and needs its matching runtime.
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: |
            mod/Source/SlopWorld/packages.lock.json
            mod/Dependencies/packages.lock.json
            mod/Tests/packages.lock.json
            .config/dotnet-tools.json

      - name: Build C# with RimRef and collect coverage
        run: just ci-mod

      - name: Report coverage
        run: |
          just coverage-summary-mod >> "$GITHUB_STEP_SUMMARY"
          echo 'C# coverage measures linked production files in the game-free harness, not the entire mod. No percentage threshold is enforced.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: ${{ !cancelled() && hashFiles('coverage/csharp.cobertura.xml') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-mod
          path: coverage/csharp.cobertura.xml
          if-no-files-found: error

      - name: Upload compiled mod
        uses: actions/upload-artifact@v6
        with:
          name: mod-assembly
          path: mod/Assemblies/SlopWorld.dll
          if-no-files-found: error
