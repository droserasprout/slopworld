name: Test

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to test
        required: false
        default: ''
        type: string
    outputs:
      commit:
        description: Tested commit
        value: ${{ jobs.test.outputs.commit }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Record tested revision
        id: revision
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: slopd

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev protobuf-compiler python3-yaml tmux less ripgrep bubblewrap

      - name: Install pinned Protobuf compiler
        run: |
          # Generated C# output must match the compiler used by make api-contract.
          curl -fsSL https://github.com/protocolbuffers/protobuf/releases/download/v36.1/protoc-36.1-linux-x86_64.zip -o "$RUNNER_TEMP/protoc.zip"
          echo "c4bc672d9d49214dc8cafdceadf4df92182d6ca8e3ec65a56b2d7de5602669b4  $RUNNER_TEMP/protoc.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"

      - name: Allow bubblewrap namespaces on the CI runner
        run: |
          # Ubuntu restricts user namespaces unless the executable has an AppArmor allowance.
          sudo tee /etc/apparmor.d/bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>
          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/bwrap
          bwrap --unshare-all --ro-bind / / --proc /proc --dev /dev -- /usr/bin/true

      - name: Install Rust coverage tooling
        run: |
          cargo install cargo-llvm-cov --locked
          echo "$(dirname "$(rustc --print target-libdir)")/bin" >> "$GITHUB_PATH"

      - name: Run game-free CI checks
        run: make ci

      - name: Report coverage
        run: |
          make coverage-summary >> "$GITHUB_STEP_SUMMARY"
          echo 'C# coverage measures linked production files in the game-free harness, not the entire mod. No percentage threshold is enforced.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: ${{ !cancelled() && hashFiles('coverage/*.cobertura.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/*.cobertura.xml
            coverage/rust.files.txt
          if-no-files-found: error
