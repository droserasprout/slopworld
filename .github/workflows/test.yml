name: Test

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to test
        required: false
        default: ''
        type: string
    outputs:
      commit:
        description: Tested commit
        value: ${{ jobs.test.outputs.commit }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: debian:forky-slim@sha256:7bb96d9b4ccd7f46f54853c258a56df0c6b628a63e65c2317959da18fd36932c
      # Sandbox tests need nested user namespaces and mounts.
      options: --privileged
    defaults:
      run:
        shell: bash
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git unzip build-essential pkg-config \
            libasound2-dev libicu78 libssl3t64 zlib1g \
            protobuf-compiler python3 python3-yaml just tmux=3.7c-1 less ripgrep bubblewrap

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Record tested revision
        id: revision
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview, rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: slopd

      - name: Install pinned Protobuf compiler
        run: |
          # Generated C# output must match the compiler used by just api-contract.
          curl -fsSL https://github.com/protocolbuffers/protobuf/releases/download/v36.1/protoc-36.1-linux-x86_64.zip -o "$RUNNER_TEMP/protoc.zip"
          echo "c4bc672d9d49214dc8cafdceadf4df92182d6ca8e3ec65a56b2d7de5602669b4  $RUNNER_TEMP/protoc.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"

      - name: Check bubblewrap namespaces in the CI container
        run: |
          bwrap --unshare-all --ro-bind / / --proc /proc --dev /dev -- /usr/bin/true

      - name: Install Rust coverage tooling
        run: |
          cargo install cargo-llvm-cov --locked
          echo "$(dirname "$(rustc --print target-libdir)")/bin" >> "$GITHUB_PATH"

      - name: Run game-free CI checks
        run: just ci

      - name: Report coverage
        run: |
          just coverage-summary >> "$GITHUB_STEP_SUMMARY"
          echo 'C# coverage measures linked production files in the game-free harness, not the entire mod. No percentage threshold is enforced.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: ${{ !cancelled() && hashFiles('coverage/*.cobertura.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/*.cobertura.xml
            coverage/rust.files.txt
          if-no-files-found: error
