name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (retag manually before rerunning)
        required: true
        default: '0.1.0'
        type: string
  push:
    tags:
      - "v*"
      - "[0-9]*"

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}

  release:
    needs: test
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate release tag
        run: |
          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test.outputs.commit }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: slopd

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev protobuf-compiler python3-yaml

      - name: Install recipe runner
        run: cargo install just --version 1.58.0 --locked

      - name: Build daemon
        run: just BUILD=release VERSION="$RELEASE_VERSION" daemon

      - name: Package release
        run: |
          tag="$RELEASE_TAG"
          daemon="slopworld-${tag}-x86_64-linux"

          mkdir -p "${daemon}/bin"
          cp slopd/target/release/slopd    "${daemon}/bin/"
          cp slopd/target/release/slopctl  "${daemon}/bin/"
          cp slopd/target/release/slopworld "${daemon}/bin/"
          cp slopd/slopd.service           "${daemon}/"
          cp packaging/slopworld.desktop   "${daemon}/"
          git rev-parse HEAD > "${daemon}/REVISION"
          tar czf "${daemon}.tar.gz" "${daemon}"
          sha256sum "${daemon}.tar.gz" > "${daemon}.tar.gz.sha256"

      - name: Create or update draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_VERSION }}
          draft: true
          overwrite_files: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            slopworld-${{ env.RELEASE_TAG }}-x86_64-linux.tar.gz*
