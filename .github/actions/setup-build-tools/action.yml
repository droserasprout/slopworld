name: Set up pinned build tools
description: Cache and install pinned Linux tools for game-free CI checks
inputs:
  coverage:
    description: Include cargo-llvm-cov, just, protoc, and uv
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/slopworld-build-tools
        key: linux-x64-build-tools-${{ inputs.coverage }}-${{ hashFiles('.github/actions/setup-build-tools/*') }}
    - name: Install tool archives
      shell: bash
      env:
        INSTALL_COVERAGE: ${{ inputs.coverage }}
      run: bash "$GITHUB_ACTION_PATH/install.sh"
    - name: Synchronize locked Python dependencies
      shell: bash
      run: uv sync --locked --no-python-downloads
