# The mod's action icons, and which glyph each slot wears.
#
# The key is the slot that UI/Chrome/Icons.cs requests.
# The tool also uses the key as the generated PNG name.
#
# Each glyph is a Codicon from a Nerd Font.
# `glyph` is the Nerd Fonts name.
# `code` is its code point in the private-use area.
# tools/icons.py reads the code point and uses the name as documentation.
# The Nerd Fonts cheat sheet supplies both values: https://www.nerdfonts.com/cheat-sheet
#
# Use only Codicons so the glyphs have consistent weight and size.
# The tool applies one scale factor to preserve the designed relative sizes.
# `note` explains why the slot uses the selected glyph.

[terminal]
glyph = "cod-terminal"
code = "ea85"

[gear]
glyph = "cod-gear"
code = "eaf8"
note = "the options row and the top bar's config door, one glyph for both"

[shield]
glyph = "cod-shield"
code = "eb53"
note = "plain, not shield-check: the tick is noise at 18px"

[play]
glyph = "cod-play"
code = "eb2c"

[stop]
glyph = "cod-debug_stop"
code = "ead7"
note = "not primitive_square, which Codicons draws small for inline use and which would read as a pebble next to play"

[check]
glyph = "cod-check"
code = "eab2"

[cross]
glyph = "cod-close"
code = "ea76"

[dot]
glyph = "cod-circle_filled"
code = "ea71"
note = "small on purpose - this is Codicons' inline status dot, and the sidebar's state badge draws it through Icons.DotBox because of that"

[agents]
glyph = "cod-robot"
code = "ec20"
note = "An actual robot. RobotFace_south is a colored pawn faceplate. A flat tint makes it a blob at this size."

[files]
glyph = "cod-folder"
code = "ea83"

[search]
glyph = "cod-search"
code = "ea6d"

[git]
glyph = "cod-git_branch"
code = "ec6f"

[library]
glyph = "cod-symbol_event"
code = "ea86"
note = "Codicons draws symbol-event as the lightning bolt. The bundled Nerd Font set has no `zap` icon."

[usage]
glyph = "cod-credit_card"
code = "eac9"
note = "the Usage options row, which used to draw a lump of ThingDefOf.Silver: money, but the game's money, on a page about what an API bills"

[link]
glyph = "cod-link"
code = "eb15"
note = "the Integrations options row: host services and credentials are links between systems"

[time]
glyph = "cod-clockface"
code = "ec75"
note = "the real clock as the last resource on the top bar"

[keyboard]
glyph = "cod-keyboard"
code = "ea65"
note = "the Keyboard options row. The lightning of `library` belongs to the sidebar's errands, and one bolt for both was the tab being misread"

[eye]
glyph = "cod-eye"
code = "ea70"
note = "the dotfile switch and a row's view action, same glyph twice"

[refresh]
glyph = "cod-refresh"
code = "eb37"

[bell]
glyph = "cod-bell"
code = "eaa2"

[menu]
glyph = "cod-menu"
code = "eb94"

[edit]
glyph = "cod-edit"
code = "ea73"

[diff]
glyph = "cod-git_compare"
code = "eafd"
note = "FileIcons has its own unrelated diff.png for .diff/.patch files, off the Material Icon Theme bake - the two do not share"

[type]
glyph = "cod-text_size"
code = "eb69"
note = "the appearance row's Aa"

[trophy]
glyph = "cod-star_full"
code = "eb59"
note = "the About row. Codicons has no trophy, and a star is the same joke at 20px"

[rimworld]
glyph = "cod-game"
code = "ec17"
note = "the vanilla RimWorld settings group"

[add]
glyph = "cod-add"
code = "ea60"
note = "the sidebar's one add button. Codicons' plus is drawn heavier than a font's \"+\", which is why the button wears a glyph now"

[filter]
glyph = "cod-filter"
code = "eaa5"
note = "the sidebar's project filter. The outline funnel, not cod-filter_filled, which is a solid wedge at 20px and reads as a play button lying down"
