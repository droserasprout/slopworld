[package]
name = "slopcar"
version = "0.0.9"
edition = "2024"
description = "Host-side container launcher for SlopWorld"
license = "MIT"

[dependencies]
anyhow = "1"
rand = "0.8"
tempfile = "3"
toml = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1"

[lints.clippy]
redundant_clone = "warn"
panic = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_doc = "warn"
unnecessary_safety_comment = "warn"
unwrap_used = "warn"
expect_used = "warn"
