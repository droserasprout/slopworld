[book]
title = "SlopWorld"
authors = ["Lev Gorodetskii"]
language = "en"

[preprocessor.constants]
command = "uv run --directory .. --locked python -m tools.docs.constants"
before = ["links"]

[preprocessor.introduction]
command = "uv run --directory .. --locked python -m tools.docs.introduction"
after = ["links"]

[output.html]
site-url = "https://slopworld.space/"
no-section-label = true
default-theme = "slopworld"
preferred-dark-theme = "slopworld"
additional-css = ["theme/slopworld.css"]
additional-js = ["theme/scrollbars.js"]

[output.html.redirect]
"help/troubleshooting.html" = "../resources/troubleshooting.html"
