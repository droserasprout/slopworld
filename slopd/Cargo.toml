[package]
name = "slopd"
version = "0.1.0"
edition = "2021"
description = "Session daemon for SlopWorld: tmux + bubblewrap agent sessions behind a localhost API"

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
dirs = "5"
futures = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "signal", "fs"] }
toml = "0.8"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
strip = true
