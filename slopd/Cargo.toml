[package]
name = "slopd"
version = "0.1.0"
edition = "2021"
description = "Session daemon for SlopWorld: tmux + bubblewrap agent sessions behind a localhost API"

[dependencies]
alacritty_terminal = "0.26"
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
base64 = "0.22"
dirs = "5"
futures = "0.3"
nix = { version = "0.28", features = ["fs", "term", "user"] }
rand = "0.8"
regex = "1"
# symphonia-vorbis is the codec and symphonia-ogg the container it always comes in;
# without the second, the OST is a file no demuxer claims and the probe reads to EOF.
rodio = { version = "0.22", default-features = false, features = ["playback", "symphonia-mp3", "symphonia-ogg", "symphonia-vorbis"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "signal", "fs", "io-util"] }
toml = "0.8"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3.3.0", default-features = false, features = ["rustls", "json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
