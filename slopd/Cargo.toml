[package]
name = "slopd"
version = "0.0.1"
edition = "2024"
description = "Session daemon for SlopWorld: tmux + bubblewrap agent sessions behind a localhost API"

[dependencies]
prost = "0.14.4"
alacritty_terminal = "0.26"
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
base64 = "0.22"
dirs = "5"
futures = "0.3"
httpdate = "1"
landlock = "0.4.7"
nix = { version = "0.28", features = ["fs", "hostname", "term", "user"] }
rand = "0.8"
ring = "0.17"
rodio = { version = "0.22", default-features = false, features = ["playback", "symphonia-mp3", "symphonia-ogg", "symphonia-vorbis"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "signal", "fs", "io-util"] }
toml = "0.8"
toml_edit = "0.22"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
ureq = { version = "3.3.0", default-features = false, features = ["rustls", "json"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
prost-build = "0.14.4"

[dev-dependencies]
tokio-tungstenite = "0.24"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true

[lints.clippy]
string_slice = "warn"
indexing_slicing = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
unchecked_time_subtraction = "warn"
panic_in_result_fn = "warn"

let_underscore_future = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"

await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
large_futures = "warn"

mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_doc = "warn"
unnecessary_safety_comment = "warn"

float_cmp = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
cast_sign_loss = "warn"
invalid_upcast_comparisons = "warn"

rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
iter_not_returning_iterator = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
dbg_macro = "warn"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"
