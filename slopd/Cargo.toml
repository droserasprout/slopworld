[package]
name = "slopd"
version = "0.1.2"
edition = "2024"
description = "Session daemon for SlopWorld: tmux + bubblewrap agent sessions behind a localhost API"
license = "MIT"

[dependencies]
anstream = "1"
clap = { version = "4", features = ["derive", "string"] }
clap_complete = "4"
prost = "0.14.4"
alacritty_terminal = "0.26"
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
base64 = "0.22"
dirs = "5"
futures = "0.3"
globset = "0.4"
httpdate = "1"
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
time = { version = "0.3", default-features = false, features = ["parsing"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
url = "2"
landlock = "0.4.7"
nix = { version = "0.28", features = ["fs", "hostname", "term", "user"] }
percent-encoding = "2"
rand = "0.8"
ring = "0.17"
rodio = { version = "0.22", default-features = false, features = ["playback", "symphonia-mp3", "symphonia-ogg", "symphonia-vorbis"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
shlex = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "signal", "fs", "io-util"] }
toml = "0.8"
toml_edit = "0.22"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "json"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Unify with rodio's CPAL dependency so only its audio callback requests real-time scheduling.
cpal = { version = "0.17", features = ["audio_thread_priority"] }

[build-dependencies]
prost-build = "0.14.4"

[dev-dependencies]
tokio-tungstenite = "0.24"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
