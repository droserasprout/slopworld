# Use private configuration because `~/.codex/config.toml` defines MCP servers that host Codex executes at startup.
# Share the authentication file because OAuth refresh tokens are single-use.
# A copied authentication file can become invalid when another Codex session refreshes the host login.
[[sandbox]]
name = "codex"
description = "Private OpenAI Codex CLI state and configuration with shared credentials"
# Codex reads the desktop clipboard for Ctrl+V image attachments in its terminal interface, add x11/wayland if needed.
requires = []
private = ["~/.codex"]
# Codex saves refreshed tokens in this file. Sharing it gives the host and all sandboxes the same tokens.
# Configuration and MCP definitions remain private.
shared = ["~/.codex/auth.json"]
seed = ["~/.codex/prompts"]
env = [
    "OPENAI_API_KEY",
    "OPENAI_BASE_URL",
    "OPENAI_ORG_ID",
    "OPENAI_PROJECT_ID",
]

[[command]]
name = "codex"
kind = "agent"
description = "OpenAI Codex CLI"
cmd = "codex --yolo -c tui.fullscreen_transcript=false"
sandbox = ["codex"]
