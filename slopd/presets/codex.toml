# Private for the same reason `claude` is: `~/.codex/config.toml` names MCP servers, and the
# host runs them the next time it starts a Codex of its own. `auth.json` and the config are
# files at the top of the directory, so they are seeded without being named.
[[sandbox]]
name = "codex"
description = "OpenAI Codex CLI's own state, config and auth, one copy per session"
# Codex's Ctrl+V image attachment path reads the desktop clipboard from inside the TUI. These
# are optional on hosts without the corresponding display, but harmless when one is absent.
requires = ["x11", "wayland"]
private = ["~/.codex"]
seed = ["~/.codex/prompts"]
env = [
    "OPENAI_API_KEY",
    "OPENAI_BASE_URL",
    "OPENAI_ORG_ID",
    "OPENAI_PROJECT_ID",
]

[[command]]
name = "codex"
description = "OpenAI Codex CLI"
cmd = "codex"
sandbox = ["codex"]
