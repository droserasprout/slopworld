# Private for the same reason `claude` is: `~/.codex/config.toml` names MCP servers, and the
# host runs them the next time it starts a Codex of its own. The auth file is the exception:
# OAuth refresh tokens are single-use, so a copied auth file becomes invalid when another Codex
# refreshes the host login. Keep one live host-owned file for every Codex session instead.
[[sandbox]]
name = "codex"
description = "OpenAI Codex CLI's own state and config, with shared auth"
# Codex's Ctrl+V image attachment path reads the desktop clipboard from inside the TUI. These
# are optional on hosts without the corresponding display, but harmless when one is absent.
requires = ["x11", "wayland"]
private = ["~/.codex"]
# Codex persists refreshed access and refresh tokens in place. Sharing this file keeps the host
# and all sandboxes on the same token lineage without exposing the private config/MCP tree.
shared = ["~/.codex/auth.json"]
seed = ["~/.codex/prompts"]
env = [
    "OPENAI_API_KEY",
    "OPENAI_BASE_URL",
    "OPENAI_ORG_ID",
    "OPENAI_PROJECT_ID",
]

[[command]]
name = "codex"
kind = "agent"
description = "OpenAI Codex CLI"
cmd = "codex"
sandbox = ["codex"]
