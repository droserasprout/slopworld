[[sandbox]]
name = "psql"
description = "PostgreSQL client configuration, credentials, psqlrc, and SSL certificates"
ro = [
    "~/.psqlrc",
    "~/.pgpass",
    "~/.config/postgresql",
]
env = [
    "PGHOST",
    "PGPORT",
    "PGDATABASE",
    "PGUSER",
    "PGPASSWORD",
    "PGSSLMODE",
    "PGSSLROOTCERT",
    "PGSSLCERT",
    "PGSSLKEY",
    "DATABASE_URL",
]
