# Include $XAUTHORITY because Xwayland stores its cookie under $XDG_RUNTIME_DIR and can leave ~/.Xauthority absent.
# The cookie file is created once per login, so mount the file directly.
[[sandbox]]
name = "x11"
description = "X11 display access"
escapes = "The sandbox can read other X11 windows and send input to them"
ro = ["/tmp/.X11-unix", "~/.Xauthority", "$XAUTHORITY"]
env = ["DISPLAY", "XAUTHORITY"]
