# Each session receives private copies of Claude configuration files.
# `~/.claude/settings.json` defines hooks. `~/.claude.json` defines MCP servers.
# Host Claude Code executes these commands when it starts.
# Private copies prevent sandbox edits from defining commands for the host.
# Initialize each copy from the user's files once. Do not write changes to the host files.
#
# Private `projects/` directories also prevent agents from reading host transcripts or other agents' transcripts.
[[sandbox]]
name = "claude"
description = "Private Claude Code state and shared credentials"
# Claude Code stores temporary work in /tmp/claude-0/.
# The sandbox tmpfs normally removes this directory between runs.
# A private copy in the session state directory preserves this work after a restart.
# It keeps subagent files, analysis output, and temporary scripts separate from other /tmp data.
private = ["~/.claude", "~/.claude.json", "/tmp/claude-0"]
# Share the credential file so the host and all sessions receive refreshed tokens.
# A private copy can become invalid when another session replaces the refresh token.
# Previously, recovery required session deletion, which also removed its transcripts.
#
# This file contains no commands, unlike settings.json.
# Sandbox writes can invalidate the user's login but cannot define a host command.
# `SandboxPreset::shared` permits only regular files.
shared = ["~/.claude/.credentials.json"]
# Copy user definitions. Top-level files in `~/.claude`, including settings, are copied automatically.
#
# Omit `plugins` to avoid copying language servers and marketplace repositories that the session does not need.
# Add required plugin directories to `seed`.
seed = [
    "~/.claude/agents",
    "~/.claude/commands",
    "~/.claude/skills",
]
# Exclude user prompt history, cached statistics, and the settings backup from automatic copying.
# These files are not needed to initialize a session.
skip = [
    "~/.claude/history.jsonl",
    "~/.claude/stats-cache.json",
    "~/.claude/settings.json.bak",
]
env = ["ANTHROPIC_API_KEY", "ANTHROPIC_BASE_URL"]

[[command]]
name = "claude"
kind = "agent"
description = "Claude Code"
cmd = "claude"
sandbox = ["claude"]
