# Mount only the socket. The ~/.gnupg directory also contains private keys.
# Restart the sandbox session if gpg-agent restarts because the socket mount retains its inode.
[[sandbox]]
name = "gpg-agent"
description = "host GnuPG agent socket"
escapes = "The sandbox can request signatures and decryption with host GnuPG keys. It does not receive the keys"
rw = ["~/.gnupg/S.gpg-agent"]
