# Mount the directory because 1Password replaces agent.sock when it restarts or locks again.
# Mounting the socket would retain the old inode, which no longer has a listener.
# op-ssh-sign finds the socket under $HOME. The sandbox uses the host HOME path, so no path argument is necessary.
[[sandbox]]
name = "1password"
description = "1Password agent for SSH authentication and commit signatures"
escapes = "The sandbox can request signatures with 1Password keys wherever those keys are trusted. It does not receive the keys"
rw = ["~/.1password"]
# Use a private copy because `op plugin` writes plugins.sh here and the host shell executes that file.
private = ["~/.config/op"]
