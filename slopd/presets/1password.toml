# The directory, not the socket in it: a bind of `agent.sock` pins the inode that was there
# at exec, and the app unlinks and recreates it on restart or relock, leaving the sandbox a
# socket with nothing listening. op-ssh-sign finds it under $HOME rather than being told,
# and HOME inside the sandbox is the real one, so nothing is passed.
[[sandbox]]
name = "1password"
description = "the 1Password agent, for SSH auth and signed commits"
escapes = "the agent signs with keys this sandbox never holds, wherever they are trusted"
rw = ["~/.1password"]
# A copy because `op plugin` writes plugins.sh into ~/.config/op and the user's shell sources it.
private = ["~/.config/op"]
