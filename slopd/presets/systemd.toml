[[sandbox]]
name = "systemd"
description = "systemctl --user, journalctl (needs dbus)"
requires = ["dbus"]
escapes = "The sandbox can request host processes through `systemd --user`"
ro = ["/run/systemd", "/sys/fs/cgroup", "/var/log/journal", "/run/log/journal"]
rw = ["$XDG_RUNTIME_DIR/systemd"]
env = ["XDG_RUNTIME_DIR"]

# systemctl first connects to $XDG_RUNTIME_DIR/systemd/private.
# That handshake fails in the bwrap user namespace (AUTHENTICATING -> CLOSED).
# The session bus connects to the same manager, so this preset requires `dbus`.
[sandbox.setenv]
SYSTEMCTL_FORCE_BUS = "1"
