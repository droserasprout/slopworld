# This optional preset mounts shell startup files with read-only access.
# It mounts history with write access so the shell can record commands without changing startup files.
[[sandbox]]
name = "bash-userdata"
description = "Bash startup files and command history"
ro = [
    "~/.bashrc",
    "~/.bash_profile",
    "~/.bash_login",
    "~/.profile",
    "~/.bash_logout",
]
rw = ["~/.bash_history"]
