[[sandbox]]
name = "ssh"
description = "SSH configuration and known hosts"
ro = [
    "~/.ssh/config",
    "~/.ssh/known_hosts",
    "~/.ssh/known_hosts.old",
]
# OpenSSH checks the ownership of included system files.
# Give each session a private copy to prevent ownership errors from the bwrap UID 0 mapping.
private = ["/etc/ssh/ssh_config.d"]
