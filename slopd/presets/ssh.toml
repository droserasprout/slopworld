[[sandbox]]
name = "ssh"
description = "SSH configuration and known hosts"
ro = [
    "~/.ssh/config",
    "~/.ssh/known_hosts",
    "~/.ssh/known_hosts.old",
]
# OpenSSH checks the ownership of included system files.
# Host root is unmapped for non-root daemons; private copies have the session's UID.
private = ["/etc/ssh/ssh_config.d"]
