# Use private state for each session, as for the Claude preset.
# `agent/` contains model selection in `models-store.json`, trust settings, and transcripts in `sessions/`.
# Copy the directory, then exclude transcripts.
# Selecting individual files previously omitted model settings.
# A new session must not inherit transcripts from the user or a previous session.
[[sandbox]]
name = "pi"
description = "Private pi state, configuration, and credentials for each session"
private = ["~/.pi"]
seed = ["~/.pi/agent"]
skip = ["~/.pi/agent/sessions"]
env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_BASE_URL",
    "OPENAI_API_KEY",
    "OPENROUTER_API_KEY",
    "GEMINI_API_KEY",
    "DEEPSEEK_API_KEY",
    "XAI_API_KEY",
    "MISTRAL_API_KEY",
]

[[command]]
name = "pi"
kind = "agent"
description = "pi coding agent"
cmd = "pi"
sandbox = ["pi"]
