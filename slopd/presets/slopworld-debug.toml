[[sandbox]]
name = "slopworld-debug"
description = "Full SlopWorld game and mod development: game files, profile, displays, devices, desktop services, diagnostics and build caches"
requires = [
    "systemd",
    "x11",
    "wayland",
    "gpu",
    "audio",
    "git",
    "rust-cache",
    "nuget-cache",
    "ccache",
    "python",
    # The macOS sidecar (slopcar) is a Docker container; debugging it means building, running and
    # exec-ing into it, which needs the host Docker socket.
    "docker",
]
# This is deliberately writable: the debug agent may build/install the mod, run the game and
# edit the SlopWorld profile. The ordinary project directory is writable separately by design.
rw = [
    "$SLOPWORLD_PROFILE",
    "$XDG_DATA_HOME/slopworld/profile",
    "~/.local/share/slopworld/profile",
    "$SLOPWORLD_GAME",
    "~/RimWorld/game",
    "~/GOG Games/RimWorld/game",
    "~/.steam/steam/steamapps/common/RimWorld",
    "~/.local/share/Steam/steamapps/common/RimWorld",
    "~/.config/unity3d/Ludeon Studios/RimWorld by Ludeon Studios",
    "~/.local/bin",
    "~/.config/systemd/user",
    # A slopcar sidecar running beside the native daemon keeps its host-side config, endpoint
    # descriptor and session state under the documented "-car" coexistence dirs; bind them so the
    # debug agent can read the token/url and inspect or reset the sidecar's sessions. Skipped when
    # absent, so this costs nothing when no sidecar is in use.
    "~/.config/slopworld-car",
    # `make run-slopcar` keeps the Linux comparison game's profile under this already-mounted
    # sidecar state root, so its saves and settings survive the debug agent sandbox.
    "~/.local/share/slopworld-car",
]
# Desktop metadata lets gio/GTK reproduce the host application's associations and chooser.
# /proc and /sys are host diagnostics; /run/udev lets graphics/device enumeration work.
ro = [
    "/proc",
    "/sys",
    "/run/udev",
    # Journal files + machine-id let `journalctl` read the daemon unit's own startup/exit logs.
    "/var/log/journal",
    "/run/log/journal",
    "/etc/machine-id",
    "$XDG_DATA_HOME/applications",
    "$XDG_DATA_HOME/flatpak/exports/share",
    "~/.local/share/applications",
    "~/.local/share/mime",
    "~/.local/share/icons",
    "/var/lib/flatpak/exports/share",
    "~/.config/mimeapps.list",
    "~/.local/share/applications/mimeapps.list",
    "~/.config/gtk-3.0",
    "~/.config/gtk-4.0",
]
# Bind the daemon's configured tmux socket, not the user's other tmux servers.
tmux = true
# Bind config.toml and endpoint.toml for connection diagnostics. This is a generated,
# read-only exception to the ordinary preset path guard.
daemon_config = true
escapes = "can modify the host game/profile, read and control host terminals, share displays and devices, expose host processes, control the host Docker daemon, and talk to desktop/systemd services"
env = [
    "SLOPWORLD_PROFILE",
    "SLOPWORLD_GAME",
    "SLOPWORLD_GAME_LOG",
    "SLOPWORLD_DAEMON_UNIT",
    "SLOPCAR_PROFILE",
    "XDG_DATA_HOME",
    "XDG_CONFIG_HOME",
    "XDG_DATA_DIRS",
    "XDG_CONFIG_DIRS",
    "XDG_CURRENT_DESKTOP",
    "XDG_SESSION_DESKTOP",
    "XDG_SESSION_TYPE",
    "DESKTOP_SESSION",
    "GDK_BACKEND",
    "GTK_USE_PORTAL",
    "DISPLAY",
    "XAUTHORITY",
    "WAYLAND_DISPLAY",
    "DBUS_SESSION_BUS_ADDRESS",
    "XDG_RUNTIME_DIR",
]

# Any slopd/slopctl the agent runs by hand prints a full panic backtrace instead of a bare
# "note run with RUST_BACKTRACE=1" line.
[sandbox.setenv]
RUST_BACKTRACE = "1"
