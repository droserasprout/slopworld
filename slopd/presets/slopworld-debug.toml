[[sandbox]]
name = "slopworld-debug"
description = "Full SlopWorld game and mod development: game files, profile, displays, devices, desktop services, diagnostics and build caches"
warning_level = "host_control"
requires = [
    "ccache",
    "docker",
    "git",
    "nuget-cache",
    "python",
    "rust-sccache",
    "systemd",
    "wayland",
    "x11",
]
# These paths are writable so the debug agent can build and install the mod, run the game, and edit the profile.
# The project directory has separate write access.
rw = [
    "$SLOPWORLD_PROFILE",
    "$SLOPD_DATA/profile",
    "$XDG_DATA_HOME/slopworld/profile",
    "~/.local/share/slopworld/profile",
    "$SLOPWORLD_GAME",
    "~/RimWorld/game",
    "~/GOG Games/RimWorld/game",
    "~/.steam/steam/steamapps/common/RimWorld",
    "~/.local/share/Steam/steamapps/common/RimWorld",
    "$SLOPWORLD_GAME_LOG",
    "$SLOPD_CACHE/Player.log",
    "$XDG_CACHE_HOME/slopworld/Player.log",
    "~/.cache/slopworld/Player.log",
    "~/.local/bin",
    "~/.config/systemd/user",
    # Sidecar game profiles and durable state use subdirectories of the data root.
    # Its configuration remains protected; Docker owns container configuration.
    "$SLOPD_DATA/sidecar",
    "$XDG_DATA_HOME/slopworld/sidecar",
    "~/.local/share/slopworld/sidecar",
    "$SLOPD_CACHE/sidecar",
    "$XDG_CACHE_HOME/slopworld/sidecar",
    "~/.cache/slopworld/sidecar",
]
# Desktop metadata lets gio and GTK use host application associations and the file chooser.
# /sys provides host diagnostics; /run/udev supports device enumeration.
# Keep the launcher's private /proc: host PIDs break process tools and nested Bubblewrap.
ro = [
    "/sys",
    "/run/udev",
    # Journal files + machine-id let `journalctl` read the daemon unit's own startup/exit logs.
    "/var/log/journal",
    "/run/log/journal",
    "/etc/machine-id",
    "$XDG_DATA_HOME/applications",
    "$XDG_DATA_HOME/flatpak/exports/share",
    "~/.local/share/applications",
    "~/.local/share/mime",
    "~/.local/share/icons",
    "/var/lib/flatpak/exports/share",
    "~/.config/mimeapps.list",
    "~/.local/share/applications/mimeapps.list",
    "~/.config/gtk-3.0",
    "~/.config/gtk-4.0",
]
# Bind the daemon's configured tmux socket. Exclude other host tmux servers.
tmux = true
# Bind native and sidecar config.toml and endpoint.toml read-only for diagnostics.
# This generated mount is an exception to the ordinary preset path restriction.
daemon_config = true
escapes = "Can use the daemon root credential, control host terminals, start processes outside the sandbox, and modify host game files and profiles"
env = [
    "SLOPWORLD_PROFILE",
    "SLOPWORLD_GAME",
    "SLOPWORLD_GAME_LOG",
    "SLOPWORLD_DAEMON_UNIT",
    "SLOPD_CONFIG_ROOT",
    "SLOPD_DATA",
    "SLOPD_CACHE",
    "SLOPCAR_CONTAINER",
    "SLOPCAR_PORT",
    "XDG_CACHE_HOME",
    "XDG_DATA_HOME",
    "XDG_CONFIG_HOME",
    "XDG_DATA_DIRS",
    "XDG_CONFIG_DIRS",
    "XDG_CURRENT_DESKTOP",
    "XDG_SESSION_DESKTOP",
    "XDG_SESSION_TYPE",
    "DESKTOP_SESSION",
    "GDK_BACKEND",
    "GTK_USE_PORTAL",
    "DISPLAY",
    "XAUTHORITY",
    "WAYLAND_DISPLAY",
    "DBUS_SESSION_BUS_ADDRESS",
    "XDG_RUNTIME_DIR",
]

# Manually started slopd and slopctl processes print full panic backtraces.
[sandbox.setenv]
RUST_BACKTRACE = "1"
