[[sandbox]]
name = "slopworld-debug"
description = "Full SlopWorld game and mod development: game files, profile, displays, devices, desktop services, diagnostics and build caches"
requires = [
    "ccache",
    "docker",
    "git",
    "nuget-cache",
    "python",
    "rust-cache",
    "systemd",
    "wayland",
    "x11",
]
# These paths are writable so the debug agent can build and install the mod, run the game, and edit the profile.
# The project directory has separate write access.
rw = [
    "$SLOPWORLD_PROFILE",
    "$XDG_DATA_HOME/slopworld/profile",
    "~/.local/share/slopworld/profile",
    # User-owned station templates live beside the profile, but keep this bind narrow because
    # the parent SlopWorld data directory also contains daemon-managed session state.
    "$SLOPWORLD_GAME",
    "~/RimWorld/game",
    "~/GOG Games/RimWorld/game",
    "~/.steam/steam/steamapps/common/RimWorld",
    "~/.local/share/Steam/steamapps/common/RimWorld",
    "~/.config/unity3d/Ludeon Studios/RimWorld by Ludeon Studios",
    "~/.local/bin",
    "~/.config/systemd/user",
    # A slopcar sidecar running beside the native daemon keeps its host-side config, endpoint
    # descriptor and session state under the documented "-car" coexistence dirs. Bind them so the
    # debug agent can read the token/url and inspect or reset the sidecar's sessions. Skipped when
    # absent, so this costs nothing when no sidecar is in use.
    "~/.config/slopworld-car",
    # `make sidecar-run` keeps the Linux comparison game's profile under this already-mounted
    # sidecar state root, so its saves and settings survive the debug agent sandbox.
    "~/.local/share/slopworld-car",
]
# Desktop metadata lets gio and GTK use host application associations and the file chooser.
# /proc and /sys provide host diagnostics. /run/udev supports graphics and device enumeration.
ro = [
    "/proc",
    "/sys",
    "/run/udev",
    # Journal files + machine-id let `journalctl` read the daemon unit's own startup/exit logs.
    "/var/log/journal",
    "/run/log/journal",
    "/etc/machine-id",
    "$XDG_DATA_HOME/applications",
    "$XDG_DATA_HOME/flatpak/exports/share",
    "~/.local/share/applications",
    "~/.local/share/mime",
    "~/.local/share/icons",
    "/var/lib/flatpak/exports/share",
    "~/.config/mimeapps.list",
    "~/.local/share/applications/mimeapps.list",
    "~/.config/gtk-3.0",
    "~/.config/gtk-4.0",
]
# Bind the daemon's configured tmux socket. Exclude other host tmux servers.
tmux = true
# Bind config.toml and endpoint.toml read-only for connection diagnostics.
# This generated mount is an exception to the ordinary preset path restriction.
daemon_config = true
escapes = "The sandbox can modify host game files and profiles, read and control host terminals, and access displays, devices, and host processes. It can also control the host Docker daemon and communicate with desktop and systemd services"
env = [
    "SLOPWORLD_PROFILE",
    "SLOPWORLD_GAME",
    "SLOPWORLD_GAME_LOG",
    "SLOPWORLD_DAEMON_UNIT",
    "SLOPCAR_PROFILE",
    "XDG_DATA_HOME",
    "XDG_CONFIG_HOME",
    "XDG_DATA_DIRS",
    "XDG_CONFIG_DIRS",
    "XDG_CURRENT_DESKTOP",
    "XDG_SESSION_DESKTOP",
    "XDG_SESSION_TYPE",
    "DESKTOP_SESSION",
    "GDK_BACKEND",
    "GTK_USE_PORTAL",
    "DISPLAY",
    "XAUTHORITY",
    "WAYLAND_DISPLAY",
    "DBUS_SESSION_BUS_ADDRESS",
    "XDG_RUNTIME_DIR",
]

# Manually started slopd and slopctl processes print full panic backtraces.
[sandbox.setenv]
RUST_BACKTRACE = "1"
