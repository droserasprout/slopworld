# ccache.conf can specify programs through prefix_command and compiler.
# Keep it read-only because host compilation executes these programs.
[[sandbox]]
name = "ccache"
description = "writable ccache compiler cache"
ro = ["~/.config/ccache/ccache.conf"]
# Existing legacy caches remain usable. Creating ~/.ccache would make modern
# ccache prefer it over ~/.cache/ccache, so only create the modern directory.
rw = ["~/.ccache"]
cache = ["~/.cache/ccache"]
