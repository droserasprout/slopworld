# Optional shell userdata: startup files and common framework directories are shared read-only,
# while history remains writable so zsh can record commands without rewriting its setup.
[[sandbox]]
name = "zsh-userdata"
category = "shell"
description = "zsh startup files, frameworks and command history"
ro = [
    "~/.zshenv",
    "~/.zprofile",
    "~/.zshrc",
    "~/.zlogin",
    "~/.zlogout",
    "~/.config/zsh",
    "~/.oh-my-zsh",
    "~/.zsh",
    "~/.p10k.zsh",
]
rw = ["~/.zsh_history"]
