# Keep the SDK read-only. Install and update toolchains on the host.
# Builds write their output in the project.
# Give each session private Gradle and Android state to protect host initialization scripts, caches, and device keys.
[[sandbox]]
name = "android-dev"
description = "Read-only Android SDK and private Gradle and Android state"
ro = [
    "$ANDROID_HOME",
    "$ANDROID_SDK_ROOT",
    "~/Android/Sdk",
    "~/Android/sdk",
    "~/.local/share/android-sdk",
    "$JAVA_HOME",
]
private = ["~/.android", "~/.gradle"]
env = ["ANDROID_HOME", "ANDROID_SDK_ROOT", "JAVA_HOME"]
