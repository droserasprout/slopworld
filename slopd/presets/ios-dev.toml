# Xcode is a macOS toolchain. These paths support future native macOS workers.
# Missing paths create no mounts on Linux. Build output directories remain writable.
# Give each session private Xcode user settings to preserve host IDE configuration.
[[sandbox]]
name = "ios-dev"
description = "Read-only Xcode tools, writable build directories, and private user settings"
ro = [
    "$DEVELOPER_DIR",
    "/Applications/Xcode.app",
    "/Applications/Xcode-beta.app",
    "/Library/Developer/CommandLineTools",
    "/Library/Developer/Toolchains",
    "~/Library/Developer/Xcode/Toolchains",
    "~/Library/MobileDevice/Provisioning Profiles",
]
rw = [
    "~/Library/Developer/Xcode/Archives",
    "~/Library/Developer/Xcode/DerivedData",
    "~/Library/Caches/com.apple.dt.Xcode",
]
private = ["~/Library/Developer/Xcode/UserData"]
env = ["DEVELOPER_DIR", "SDKROOT"]
