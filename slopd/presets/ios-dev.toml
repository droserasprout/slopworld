# Xcode is a macOS toolchain, so these paths are intentionally harmless on Linux and become
# useful to a future native macOS worker. Build products remain writable, while Xcode's user
# settings get a per-session copy rather than changing the host's IDE configuration.
[[sandbox]]
name = "ios-dev"
description = "Xcode and iOS build tooling, one copy per session"
ro = [
    "$DEVELOPER_DIR",
    "/Applications/Xcode.app",
    "/Applications/Xcode-beta.app",
    "/Library/Developer/CommandLineTools",
    "/Library/Developer/Toolchains",
    "~/Library/Developer/Xcode/Toolchains",
    "~/Library/MobileDevice/Provisioning Profiles",
]
rw = [
    "~/Library/Developer/Xcode/Archives",
    "~/Library/Developer/Xcode/DerivedData",
    "~/Library/Caches/com.apple.dt.Xcode",
]
private = ["~/Library/Developer/Xcode/UserData"]
env = ["DEVELOPER_DIR", "SDKROOT"]
