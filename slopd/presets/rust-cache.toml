[[sandbox]]
name = "rust-cache"
description = "writable Cargo and rustup caches (requires rust)"
requires = ["rust"]
# rustup needs both download storage and temporary staging when installing pins.
cache = [
    "~/.cargo/registry",
    "~/.cargo/git",
    "~/.rustup/downloads",
    "~/.rustup/tmp",
]
# Installed toolchains and update metadata retain existing-only access.
rw = [
    "~/.rustup/toolchains",
    "~/.rustup/update-hashes",
]
