# RubyGems loads rubygems_plugin.rb from each installed gem for every gem command, including host commands.
# Keep the gem directory read-only to prevent changes to host plugins.
[[sandbox]]
name = "ruby"
description = "user-installed gems and Bundler configuration, read-only"
ro = [
    "~/.gemrc",
    "~/.gem",
    "~/.local/share/gem",
    # The file rather than ~/.bundle, which also holds Bundler plugins.
    "~/.bundle/config",
]
