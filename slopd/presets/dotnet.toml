# NuGet.Config and the plugins beside it name credential-provider executables that the host's
# next restore runs, so both stay read-only.
[[sandbox]]
name = "dotnet"
description = ".NET CLI state and NuGet configuration, one copy per session"
ro = ["~/.nuget/NuGet/NuGet.Config", "~/.nuget/plugins"]
# A copy because ~/.dotnet/tools holds executables on the user's own PATH.
private = ["~/.dotnet"]
# DOTNET_CLI_HOME and NUGET_PACKAGES are omitted because each relocates a path bound here.
env = ["DOTNET_ROOT"]
