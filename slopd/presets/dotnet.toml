# NuGet.Config and its adjacent plugins specify credential-provider executables for host restore operations.
# Keep both paths read-only.
[[sandbox]]
name = "dotnet"
description = "Private .NET CLI state and read-only NuGet configuration"
ro = ["~/.nuget/NuGet/NuGet.Config", "~/.nuget/plugins"]
# Use a private copy because ~/.dotnet/tools contains executables on the host user PATH.
private = ["~/.dotnet"]
# Omit DOTNET_CLI_HOME and NUGET_PACKAGES because each changes a path that this preset mounts.
env = ["DOTNET_ROOT"]
