# Copy OpenCode configuration privately: its background server writes service.json here.
# Sandbox configuration changes must not define commands for host OpenCode.
# Give each session private copies of credentials and state.
# Give each session a private cache to prevent corruption from concurrent writes by multiple agents.
[[sandbox]]
name = "opencode"
description = "Private OpenCode configuration, credentials, state, and cache"
private = [
    "~/.config/opencode",
    "~/.local/share/opencode",
    "~/.local/state/opencode",
    "~/.cache/opencode",
]
# Preserve configured plugins and other configuration subdirectories.
seed = ["~/.config/opencode"]
# Each agent starts its own server rather than adopting a host server descriptor.
skip = ["~/.config/opencode/service.json"]
env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_BASE_URL",
    "OPENAI_API_KEY",
    "OPENROUTER_API_KEY",
]

[[command]]
name = "opencode"
kind = "agent"
description = "OpenCode"
cmd = "opencode"
sandbox = ["opencode"]
