# Mount OpenCode configuration read-only to prevent sandbox changes from defining commands for host OpenCode.
# Give each session private copies of credentials and state.
# Give each session a private cache to prevent corruption from concurrent writes by multiple agents.
[[sandbox]]
name = "opencode"
description = "Read-only OpenCode configuration and private credentials, state, and cache"
ro = ["~/.config/opencode"]
private = [
    "~/.local/share/opencode",
    "~/.local/state/opencode",
    "~/.cache/opencode",
]
env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_BASE_URL",
    "OPENAI_API_KEY",
    "OPENROUTER_API_KEY",
]

[[command]]
name = "opencode"
kind = "agent"
description = "OpenCode"
cmd = "opencode"
sandbox = ["opencode"]
