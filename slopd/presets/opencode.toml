# Split three ways, because the four directories are three different things. The config is
# read-only: OpenCode reads it and the user writes it, so nothing is lost by making that true
# inside the sandbox, and an agent that cannot write it cannot name a command for the host's
# next OpenCode to run. Auth and state are private, one copy per session. The cache is private
# too - not for safety, but because two agents grinding one cache is how a cache gets corrupt.
[[sandbox]]
name = "opencode"
description = "OpenCode's own config, credentials and state, one copy per session"
ro = ["~/.config/opencode"]
private = [
    "~/.local/share/opencode",
    "~/.local/state/opencode",
    "~/.cache/opencode",
]
env = [
    "ANTHROPIC_API_KEY",
    "ANTHROPIC_BASE_URL",
    "OPENAI_API_KEY",
    "OPENROUTER_API_KEY",
]

[[command]]
name = "opencode"
kind = "agent"
description = "OpenCode"
cmd = "opencode"
sandbox = ["opencode"]
