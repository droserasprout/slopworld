# The [extensions] section of ~/.hgrc specifies Python modules for Mercurial to import with every command.
# Keep this file read-only because host Mercurial also imports these modules.
[[sandbox]]
name = "hg"
description = "global Mercurial identity and configuration"
ro = ["~/.hgrc", "~/.config/hg"]
env = ["HGUSER", "EMAIL"]
